name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      # The OLED renderer needs Pillow; fonts fall back to Pillow's default.
      - run: sudo apt-get update -q && sudo apt-get install -y -q python3-pil
      - run: ./tests/run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-source
          path: |
            manifest.json
            Panel.qml
            bin/
            hooks/
            systemd/
            udev/
            install/
            uninstall/
            README.md
            LICENSE
